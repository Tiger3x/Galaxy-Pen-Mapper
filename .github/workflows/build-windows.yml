name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test applications and correction engine
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Configure diagnostic offline tests
        run: cmake -S diagnostics -B build-diagnostic -A x64

      - name: Build diagnostic tools
        run: cmake --build build-diagnostic --config Release

      - name: Test diagnostic pairing and deployment logic
        shell: pwsh
        run: |
          ctest --test-dir build-diagnostic -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/DiagnosticDeploymentTest.ps1
          ./tests/DiagnosticPackageLookupTest.ps1

      - name: Upload Windows tools
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPenMapper-windows-x64
          path: |
            build/Release/GalaxyPenHidScanner.exe
            build/Release/GalaxyPenEventMonitor.exe
            build/Release/GalaxyPenMapperTray.exe
          if-no-files-found: error
